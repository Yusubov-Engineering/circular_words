name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately, and separate from the root pubspec's `flutter:`
  # constraint. That constraint is a range (`>=3.47.0`) so the app stays
  # usable on later releases, but setup-flutter cannot resolve a range — it
  # needs one exact version to download. This is the floor of that range.
  FLUTTER_VERSION: 3.47.0
  # The CLI lives in the template monorepo, at tool/cli. Pinned to a commit
  # there, since the monorepo has no per-package tags; move it forward
  # deliberately, the same way template fixes are ported.
  MODULAR_CLI_REF: 8473dc607ac9ac2db30385e2a631f490ebf7ff56

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `dart format` picks its line-splitting style from each package's
      # language version, which it reads out of .dart_tool/package_config.json.
      # Without a resolve first, CI formats differently than a local machine.
      # One resolution at the root covers every workspace package.
      - name: Resolve workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # `flutter test` at the workspace root finds nothing; melos runs it in
      # each package that actually has a test directory.
      - name: Test
        run: dart run melos test

      # Installed the same way a developer installs it, from the template repo.
      - name: Install the modular CLI
        run: |
          dart pub global activate --source git https://github.com/Yusubov-Engineering/modular-flutter-template.git --git-path tool/cli --git-ref ${{ env.MODULAR_CLI_REF }}
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Rules the analyzer cannot see: unregistered modules, _impl→_impl
      # edges, packages missing from the workspace list.
      - name: Architecture rules
        run: modular doctor
