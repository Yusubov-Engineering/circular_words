# App icons, generated from assets/brand/, which is rendered from the logo's
# painter by core/design_system/tool/render_brand_assets.dart.
#
# flutter_launcher_icons cannot be a dependency of this workspace (it needs a
# cli_util that melos rules out), so it runs as a global tool:
#
#     dart pub global activate flutter_launcher_icons
#     dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_background: "assets/brand/icon_background.png"
  min_sdk_android: 21
